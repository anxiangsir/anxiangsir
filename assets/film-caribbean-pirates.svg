    <rect x="0" y="0" width="960" height="540" fill="#000"/>
    <g>
      <g>
        <animateTransform attributeName="transform" type="scale" values="1;1.1;1" dur="26s" repeatCount="indefinite" additive="sum"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;-24 -9;0 0" dur="26s" repeatCount="indefinite" additive="sum"/>
        <rect x="-80" y="-40" width="1120" height="460" fill="url(#sky)"/>
        <g fill="#fff"><circle cx="120" cy="70" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle><circle cx="240" cy="120" r="1.3"><animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="330" cy="60" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="3.6s" repeatCount="indefinite"/></circle><circle cx="620" cy="80" r="1.3"><animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/></circle><circle cx="760" cy="140" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="3.2s" repeatCount="indefinite"/></circle><circle cx="850" cy="64" r="1.3"><animate attributeName="opacity" values="1;.2;1" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="500" cy="50" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle><circle cx="180" cy="150" r="1.3"><animate attributeName="opacity" values="1;.2;1" dur="2.6s" repeatCount="indefinite"/></circle><circle cx="690" cy="44" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="3.4s" repeatCount="indefinite"/></circle></g>
        
        <g stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0"><line x1="0" y1="0" x2="46" y2="20"/><animate attributeName="opacity" values="0;0;.9;0;0" keyTimes="0;.55;.62;.7;1" dur="9s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="760 40;560 130;560 130" keyTimes="0;.12;1" dur="9s" repeatCount="indefinite"/></g>
        <circle cx="480" cy="150" r="70" fill="url(#sun)"><animate attributeName="cy" values="138;156;138" dur="22s" repeatCount="indefinite"/></circle>
        <circle cx="480" cy="150" r="30" fill="#fff5d8" filter="url(#glow)"><animate attributeName="cy" values="138;156;138" dur="22s" repeatCount="indefinite"/></circle>
        
        
        <g><path d="M-80 360 L120 300 L280 350 L460 285 L640 345 L820 295 L1040 350 L1040 380 L-80 380 Z" fill="url(#m1)"/><animateTransform attributeName="transform" type="translate" values="0 0;16 0;0 0" dur="26s" repeatCount="indefinite"/></g>
        <g><path d="M-80 372 L160 320 L380 372 L560 318 L760 372 L980 326 L1040 372 L-80 372 Z" fill="url(#m2)"/><animateTransform attributeName="transform" type="translate" values="0 0;36 0;0 0" dur="26s" repeatCount="indefinite"/></g>
        <rect x="-80" y="372" width="1120" height="220" fill="url(#water)"/>
        <g clip-path="url(#below)" filter="url(#rip)" opacity=".75" style="mix-blend-mode:screen"><circle cx="480" cy="280" r="120" fill="url(#sun)"><animate attributeName="cy" values="274;258;274" dur="22s" repeatCount="indefinite"/></circle><rect x="430" y="372" width="100" height="200" fill="#ffc56e" opacity=".5"/></g>
        
        
  <g transform="translate(650 350)" fill="#02080c" stroke="#02080c" stroke-linecap="round" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="650 350;618 344;650 350" dur="18s" repeatCount="indefinite"/>
    <path d="M-98 22 C-68 48 52 50 98 22 L72 58 C25 72 -40 70 -80 56 Z"/>
    <path d="M-78 22 C-30 34 30 34 80 22" fill="none" stroke-width="4"/>
    <rect x="-4" y="-122" width="8" height="148"/>
    <rect x="-62" y="-76" width="5" height="92"/>
    <path d="M4 -118 C54 -98 76 -58 8 -48 Z" fill="#ffd37a" opacity=".7"/>
    <path d="M-8 -92 C-50 -78 -70 -44 -10 -38 Z" fill="#ffd37a" opacity=".55"/>
    <path d="M4 -42 C48 -34 68 -8 8 4 Z" fill="#ffd37a" opacity=".38"/>
    <path d="M-92 30 L-124 42" stroke-width="5"/>
    <circle cx="-28" cy="42" r="4" fill="#000" opacity=".55"/>
    <circle cx="20" cy="44" r="4" fill="#000" opacity=".55"/>
  </g>
        
        
  <g fill="none" stroke="#02080c" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="-1 96 540;1.4 96 540;-1 96 540" dur="9s" repeatCount="indefinite"/>
    <path stroke-width="11" d="M96 542 C94 472 90 420 98 372"/>
    <path stroke-width="6" d="M98 372 C86 352 70 344 52 340 M98 372 C112 350 130 342 150 340 M96 396 C82 386 68 384 54 384 M98 416 C114 408 130 408 146 406"/>
    <path stroke-width="3" d="M52 340 C44 332 38 324 32 312 M150 340 C160 332 166 322 172 310 M54 384 C46 380 40 374 36 364 M146 406 C156 402 164 396 170 386 M98 352 C100 340 104 330 110 320"/>
  </g>
        
        
  <g fill="none" stroke="#031018" stroke-width="2" stroke-linecap="round" opacity=".85">
    <g><path transform="translate(0 0) scale(0.95)" d="M0 0 q5 -5 10 0 q5 -5 10 0"/><path transform="translate(-15 7) scale(0.92)" d="M0 0 q5 -5 10 0 q5 -5 10 0"/><path transform="translate(15 7) scale(0.89)" d="M0 0 q5 -5 10 0 q5 -5 10 0"/><path transform="translate(-30 14) scale(0.86)" d="M0 0 q5 -5 10 0 q5 -5 10 0"/><path transform="translate(30 14) scale(0.83)" d="M0 0 q5 -5 10 0 q5 -5 10 0"/><path transform="translate(-45 21) scale(0.80)" d="M0 0 q5 -5 10 0 q5 -5 10 0"/><path transform="translate(45 21) scale(0.77)" d="M0 0 q5 -5 10 0 q5 -5 10 0"/>
      <animateTransform attributeName="transform" type="translate" values="1000 96;-160 150;-160 150" keyTimes="0;.85;1" dur="26s" repeatCount="indefinite"/>
    </g>
  </g>
      </g>
    </g>
    
    <rect x="0" y="0" width="960" height="540" fill="url(#grade)" style="mix-blend-mode:soft-light"/>
    <rect x="0" y="0" width="960" height="540" fill="url(#vig)"/>
    
    
    <g text-anchor="middle" fill="#fff" filter="url(#glow)" font-weight="700">
      <text x="480" y="266" font-size="58" letter-spacing="2"><tspan>an</tspan><tspan fill="#ffd37a">xiang</tspan><tspan>sir</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.08;.2;.5;.62;1" dur="13s" repeatCount="indefinite"/></text>
    </g>
    <g text-anchor="middle" fill="#ffd37a"><text x="480" y="304" font-size="14" letter-spacing="7" opacity=".9">C A R I B B E A N   P I R A T E S   ·   P U R E   S V G<animate attributeName="opacity" values="0;0;.9;.9;0;0" keyTimes="0;.12;.24;.5;.62;1" dur="13s" repeatCount="indefinite"/></text></g>
    <rect x="0" y="0" width="960" height="540" filter="url(#grain)" opacity="0.5" style="mix-blend-mode:overlay"/>
  </g>
</svg>
