<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" preserveAspectRatio="xMidYMid slice" font-family="-apple-system, 'PingFang SC', system-ui, sans-serif" data-style="dwarf-rabbit">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#101b2f"/><stop offset="25%" stop-color="#243d5b"/><stop offset="50%" stop-color="#5b7fa6"/><stop offset="75%" stop-color="#d8b2c5"/><stop offset="100%" stop-color="#ffe0b2"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8dcf7e"/><stop offset="50%" stop-color="#4f9b56"/><stop offset="100%" stop-color="#15391f"/></linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffffff"/><stop offset="30%" stop-color="#ffe8f1"/><stop offset="100%" stop-color="#d7e8ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffe8f1" stop-opacity=".5"/><stop offset="100%" stop-color="#ffe8f1" stop-opacity="0"/></linearGradient>
    <radialGradient id="flareOrb" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffb7d5" stop-opacity=".7"/><stop offset="100%" stop-color="#ffb7d5" stop-opacity="0"/></radialGradient>
    <linearGradient id="flareStreak" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ffb7d5" stop-opacity="0"/><stop offset="50%" stop-color="#eaf7ff" stop-opacity=".85"/><stop offset="100%" stop-color="#ffb7d5" stop-opacity="0"/></linearGradient>
    <radialGradient id="ember" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffe6b0"/><stop offset="60%" stop-color="#ffb863" stop-opacity=".8"/><stop offset="100%" stop-color="#ffb863" stop-opacity="0"/></radialGradient>
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8ebf85"/><stop offset="100%" stop-color="#4f8553"/></linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4d7c45"/><stop offset="100%" stop-color="#17351f"/></linearGradient>
    <linearGradient id="grade" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffbfd6" stop-opacity=".3"/><stop offset="100%" stop-color="#4ea96a" stop-opacity=".35"/></linearGradient>
    <radialGradient id="vig" cx="50%" cy="46%" r="65%"><stop offset="45%" stop-color="#000" stop-opacity="0"/><stop offset="82%" stop-color="#000" stop-opacity="0.4"/><stop offset="100%" stop-color="#000" stop-opacity="0.85"/></radialGradient>
