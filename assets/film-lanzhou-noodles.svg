      <path d="M-46 -82 C-68 -118 -24 -134 -46 -174"><animate attributeName="d" values="M-46 -82 C-68 -118 -24 -134 -46 -174;M-46 -82 C-26 -118 -66 -134 -46 -174;M-46 -82 C-68 -118 -24 -134 -46 -174" dur="5s" repeatCount="indefinite"/></path><path d="M-16 -82 C-38 -118 6 -134 -16 -174"><animate attributeName="d" values="M-16 -82 C-38 -118 6 -134 -16 -174;M-16 -82 C4 -118 -36 -134 -16 -174;M-16 -82 C-38 -118 6 -134 -16 -174" dur="6s" repeatCount="indefinite"/></path><path d="M16 -82 C-6 -118 38 -134 16 -174"><animate attributeName="d" values="M16 -82 C-6 -118 38 -134 16 -174;M16 -82 C36 -118 -4 -134 16 -174;M16 -82 C-6 -118 38 -134 16 -174" dur="7s" repeatCount="indefinite"/></path><path d="M46 -82 C24 -118 68 -134 46 -174"><animate attributeName="d" values="M46 -82 C24 -118 68 -134 46 -174;M46 -82 C66 -118 26 -134 46 -174;M46 -82 C24 -118 68 -134 46 -174" dur="8s" repeatCount="indefinite"/></path>
    </g>
