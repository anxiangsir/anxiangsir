    </g>
    <g text-anchor="middle" fill="#facc15"><text x="480" y="304" font-size="14" letter-spacing="7" opacity=".9">L A N Z H O U   N O O D L E S   ·   P U R E   S V G<animate attributeName="opacity" values="0;0;.9;.9;0;0" keyTimes="0;.12;.24;.5;.62;1" dur="13s" repeatCount="indefinite"/></text></g>
