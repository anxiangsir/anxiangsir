      <path d="M-120 -110 L172 -46" stroke="#170704" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>
        
        
        <g style="mix-blend-mode:screen"><circle cx="300" cy="520" r="1.8" fill="url(#ember)"><animate attributeName="cy" values="520;180" dur="11s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.8;1" dur="11s" begin="0s" repeatCount="indefinite"/><animate attributeName="cx" values="300;318;300" dur="5s" repeatCount="indefinite"/></circle><circle cx="640" cy="520" r="2.1" fill="url(#ember)"><animate attributeName="cy" values="520;192" dur="13s" begin="-4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.8;1" dur="13s" begin="-4s" repeatCount="indefinite"/><animate attributeName="cx" values="640;658;640" dur="6s" repeatCount="indefinite"/></circle><circle cx="470" cy="520" r="2.4" fill="url(#ember)"><animate attributeName="cy" values="520;204" dur="14s" begin="-8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.8;1" dur="14s" begin="-8s" repeatCount="indefinite"/><animate attributeName="cx" values="470;488;470" dur="7s" repeatCount="indefinite"/></circle><circle cx="800" cy="520" r="1.8" fill="url(#ember)"><animate attributeName="cy" values="520;216" dur="12s" begin="-6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.8;1" dur="12s" begin="-6s" repeatCount="indefinite"/><animate attributeName="cx" values="800;818;800" dur="5s" repeatCount="indefinite"/></circle><circle cx="180" cy="520" r="2.1" fill="url(#ember)"><animate attributeName="cy" values="520;228" dur="13.5s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.8;1" dur="13.5s" begin="-2s" repeatCount="indefinite"/><animate attributeName="cx" values="180;198;180" dur="6s" repeatCount="indefinite"/></circle></g>
        
  <g fill="none" stroke="#241008" stroke-width="2" stroke-linecap="round" opacity=".85">
    <g><path transform="translate(0 0) scale(0.95)" d="M0 0 q5 -5 10 0 q5 -5 10 0"/><path transform="translate(-15 7) scale(0.92)" d="M0 0 q5 -5 10 0 q5 -5 10 0"/><path transform="translate(15 7) scale(0.89)" d="M0 0 q5 -5 10 0 q5 -5 10 0"/><path transform="translate(-30 14) scale(0.86)" d="M0 0 q5 -5 10 0 q5 -5 10 0"/><path transform="translate(30 14) scale(0.83)" d="M0 0 q5 -5 10 0 q5 -5 10 0"/><path transform="translate(-45 21) scale(0.80)" d="M0 0 q5 -5 10 0 q5 -5 10 0"/><path transform="translate(45 21) scale(0.77)" d="M0 0 q5 -5 10 0 q5 -5 10 0"/>
      <animateTransform attributeName="transform" type="translate" values="1000 96;-160 150;-160 150" keyTimes="0;.85;1" dur="26s" repeatCount="indefinite"/>
