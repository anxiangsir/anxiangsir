        <polygon points="480,300 430,440 530,440" fill="url(#ray)"><animateTransform attributeName="transform" type="rotate" values="5 480 300;-5 480 300;5 480 300" dur="11s" repeatCount="indefinite"/></polygon>
      </g>
        
        <g><path d="M-80 360 L120 300 L280 350 L460 285 L640 345 L820 295 L1040 350 L1040 380 L-80 380 Z" fill="url(#m1)"/><animateTransform attributeName="transform" type="translate" values="0 0;16 0;0 0" dur="26s" repeatCount="indefinite"/></g>
        <g><path d="M-80 372 L160 320 L380 372 L560 318 L760 372 L980 326 L1040 372 L-80 372 Z" fill="url(#m2)"/><animateTransform attributeName="transform" type="translate" values="0 0;36 0;0 0" dur="26s" repeatCount="indefinite"/></g>
        <rect x="-80" y="372" width="1120" height="220" fill="url(#water)"/>
