<svg width="370" height="1088" viewBox="0 0 370 1088" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Xiang An's GitHub dashboard</title>
  <desc id="desc">Mobile GitHub dashboard. Stars 48,860, commits 16,028, rank A+.</desc>
  
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1220" stop-opacity=".96"/>
      <stop offset="1" stop-color="#111827" stop-opacity=".88"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="370" y2="1088" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset=".52" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity=".16"/>
    </filter>
    <style>
      .title{font:800 31px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc;letter-spacing:0}
      .subtitle{font:500 13px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8;letter-spacing:0}
      .typing{font:700 18px Fira Code,Consolas,monospace;fill:#0ea5e9;letter-spacing:0}
      .label{font:700 10px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8;text-transform:uppercase;letter-spacing:.08em}
      .metric{font:800 25px Inter,Segoe UI,Arial,sans-serif;letter-spacing:0}
      .sectionTitle{font:800 19px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc;letter-spacing:0}
      .lang{font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#dbeafe;letter-spacing:0}
      .langPercent{font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8;letter-spacing:0}
      .tiny{font:600 10px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8;letter-spacing:0}
      .trophyRank{font:900 11px Inter,Segoe UI,Arial,sans-serif;letter-spacing:0}
      .trophyTitle{font:800 12px Inter,Segoe UI,Arial,sans-serif;fill:#dbeafe;letter-spacing:0}
      .trophyScore{font:700 10px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8;letter-spacing:0}
    </style>
  </defs>
  <rect x="1" y="1" width="368" height="1086" rx="24" fill="none" stroke="url(#line)" stroke-opacity=".6"/>
  <g filter="url(#softShadow)">
    <rect x="14" y="14" width="342" height="1060" rx="20" fill="#0b1220" fill-opacity=".72" stroke="#334155" stroke-opacity=".48"/>
  </g>
  
    <text x="28" y="54" class="title">Xiang An</text>
    <text x="28" y="79" class="subtitle">GitHub dashboard</text>
    
  <text x="28" y="108" class="typing" opacity="0">AI Researcher
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.72;0.86;1" dur="12s" begin="0s" repeatCount="indefinite"/>
  </text>
  <text x="28" y="108" class="typing" opacity="0">Open-source Builder
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.72;0.86;1" dur="12s" begin="3s" repeatCount="indefinite"/>
  </text>
  <text x="28" y="108" class="typing" opacity="0">Multimodal AI
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.72;0.86;1" dur="12s" begin="6s" repeatCount="indefinite"/>
  </text>
