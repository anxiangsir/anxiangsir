<svg width="900" height="530" viewBox="0 0 900 530" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Xiang An's GitHub dashboard</title>
  <desc id="desc">Stars 48,860, commits 16,028, rank A+.</desc>
  
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".96"/>
      <stop offset="1" stop-color="#f8fafc" stop-opacity=".88"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="900" y2="530" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset=".52" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#dbeafe" flood-opacity=".16"/>
    </filter>
    <style>
      .title{font:800 31px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a;letter-spacing:0}
      .subtitle{font:500 13px Inter,Segoe UI,Arial,sans-serif;fill:#64748b;letter-spacing:0}
      .typing{font:700 18px Fira Code,Consolas,monospace;fill:#0ea5e9;letter-spacing:0}
      .label{font:700 10px Inter,Segoe UI,Arial,sans-serif;fill:#64748b;text-transform:uppercase;letter-spacing:.08em}
      .metric{font:800 25px Inter,Segoe UI,Arial,sans-serif;letter-spacing:0}
      .sectionTitle{font:800 19px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a;letter-spacing:0}
      .lang{font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#1e293b;letter-spacing:0}
      .langPercent{font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#64748b;letter-spacing:0}
      .tiny{font:600 10px Inter,Segoe UI,Arial,sans-serif;fill:#64748b;letter-spacing:0}
      .trophyRank{font:900 11px Inter,Segoe UI,Arial,sans-serif;letter-spacing:0}
      .trophyTitle{font:800 12px Inter,Segoe UI,Arial,sans-serif;fill:#1e293b;letter-spacing:0}
      .trophyScore{font:700 10px Inter,Segoe UI,Arial,sans-serif;fill:#64748b;letter-spacing:0}
    </style>
