<svg width="980" height="620" viewBox="0 0 980 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Xiang An's GitHub stats, trophies, and top languages</title>
  <desc id="desc">Stars 48,858, commits 16,025, rank A+, top language Python.</desc>
  <defs>
