      .typing{font:700 22px Fira Code,Consolas,monospace;fill:#0ea5e9;letter-spacing:0}
      .label{font:700 11px Inter,Segoe UI,Arial,sans-serif;fill:#475569;text-transform:uppercase;letter-spacing:.08em}
