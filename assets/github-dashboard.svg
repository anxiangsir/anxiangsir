<svg width="980" height="430" viewBox="0 0 980 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Xiang An's GitHub stats and top languages</title>
  <desc id="desc">Stars 48,858, commits 16,025, rank A+, top language Python.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="980" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset=".48" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="glow" x1="110" y1="31" x2="865" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="154" y2="86" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827" stop-opacity=".88"/>
      <stop offset="1" stop-color="#020617" stop-opacity=".76"/>
    </linearGradient>
    <filter id="blurGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.25 0 0 0 0 0.9 0 0 0 0 1 0 0 0 .65 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <radialGradient id="orbA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(140 92) rotate(49) scale(190 120)">
      <stop stop-color="#0ea5e9" stop-opacity=".55"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(820 320) rotate(49) scale(220 140)">
      <stop stop-color="#22c55e" stop-opacity=".42"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="980" height="430" rx="30"/></clipPath>
    <style>
      .title{font:700 34px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc;letter-spacing:0}
      .subtitle{font:500 14px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8;letter-spacing:0}
      .label{font:600 12px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8;text-transform:uppercase;letter-spacing:.08em}
      .metric{font:800 28px Inter,Segoe UI,Arial,sans-serif;letter-spacing:0}
      .rank{font:900 68px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc;letter-spacing:0}
      .sectionTitle{font:800 24px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc;letter-spacing:0}
      .lang{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#dbeafe;letter-spacing:0}
      .langPercent{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#93c5fd;letter-spacing:0}
      .tiny{font:600 11px Inter,Segoe UI,Arial,sans-serif;fill:#64748b;letter-spacing:0}
      .scan{animation:scan 4s linear infinite}
      .float{}
      .langRow{}
      @keyframes scan{0%{transform:translateX(-500px)}100%{transform:translateX(980px)}}
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="980" height="430" fill="url(#bg)"/>
    <rect width="980" height="430" fill="url(#orbA)"/>
    <rect width="980" height="430" fill="url(#orbB)"/>
    <path d="M-90 329C80 250 130 406 283 301C436 196 519 254 660 152C766 76 864 92 1078 14" stroke="url(#glow)" stroke-width="2" stroke-opacity=".42"/>
    <path d="M-80 374C119 273 226 408 359 306C491 204 579 286 736 174C848 95 908 131 1064 72" stroke="#38bdf8" stroke-width="1" stroke-opacity=".18"/>
    <rect class="scan" y="0" width="280" height="430" fill="url(#glow)" opacity=".06"/>

    <rect x="24" y="24" width="932" height="382" rx="26" fill="#020617" fill-opacity=".46" stroke="url(#glow)" stroke-opacity=".65"/>
    <rect x="36" y="36" width="908" height="358" rx="20" fill="#0f172a" fill-opacity=".36" stroke="#334155" stroke-opacity=".42"/>

    <text x="64" y="82" class="title">Xiang An's GitHub stats</text>
    <text x="64" y="110" class="subtitle">Private-instance telemetry, refreshed from GitHub Readme Stats APIs</text>
    <text x="64" y="132" class="tiny">Generated 2026-06-23</text>

    
  <g class="float" style="animation-delay:0ms" transform="translate(64 162)">
    <rect width="154" height="86" rx="18" fill="url(#panel)" stroke="#22d3ee" stroke-opacity=".32"/>
    <text x="18" y="29" class="label">Stars</text>
    <text x="18" y="62" class="metric" fill="#22d3ee">48,858</text>
  </g>
    
  <g class="float" style="animation-delay:160ms" transform="translate(236 162)">
    <rect width="154" height="86" rx="18" fill="url(#panel)" stroke="#a78bfa" stroke-opacity=".32"/>
    <text x="18" y="29" class="label">Commits</text>
    <text x="18" y="62" class="metric" fill="#a78bfa">16,025</text>
  </g>
    
  <g class="float" style="animation-delay:320ms" transform="translate(408 162)">
    <rect width="154" height="86" rx="18" fill="url(#panel)" stroke="#34d399" stroke-opacity=".32"/>
    <text x="18" y="29" class="label">Pull requests</text>
    <text x="18" y="62" class="metric" fill="#34d399">479</text>
  </g>
    
  <g class="float" style="animation-delay:480ms" transform="translate(64 272)">
    <rect width="154" height="86" rx="18" fill="url(#panel)" stroke="#fbbf24" stroke-opacity=".32"/>
    <text x="18" y="29" class="label">Issues</text>
    <text x="18" y="62" class="metric" fill="#fbbf24">23</text>
  </g>
    
  <g class="float" style="animation-delay:640ms" transform="translate(236 272)">
    <rect width="154" height="86" rx="18" fill="url(#panel)" stroke="#fb7185" stroke-opacity=".32"/>
    <text x="18" y="29" class="label">Contributed</text>
    <text x="18" y="62" class="metric" fill="#fb7185">18</text>
  </g>
    
  <g class="float" style="animation-delay:800ms" transform="translate(408 272)">
    <rect width="154" height="86" rx="18" fill="url(#panel)" stroke="#38bdf8" stroke-opacity=".32"/>
    <text x="18" y="29" class="label">Rank</text>
    <text x="18" y="62" class="metric" fill="#38bdf8">A+</text>
  </g>

    <g transform="translate(610 160)">
      <text x="0" y="-18" class="sectionTitle">Top languages</text>
      
        <g class="langRow" transform="translate(0 0)">
          <circle cx="8" cy="8" r="5" fill="#3572A5"/>
          <text x="22" y="12" class="lang">Python</text>
          <text x="266" y="12" class="langPercent" text-anchor="end">81.12%</text>
          <rect x="0" y="19" width="270" height="7" rx="3.5" fill="#1f2937"/>
          <rect x="0" y="19" width="219.0" height="7" rx="3.5" fill="#3572A5">
            <animate attributeName="width" from="0" to="219.0" dur="1.2s" begin="0s" fill="freeze"/>
          </rect>
        </g>
        <g class="langRow" transform="translate(0 31)">
          <circle cx="8" cy="8" r="5" fill="#e34c26"/>
          <text x="22" y="12" class="lang">HTML</text>
          <text x="266" y="12" class="langPercent" text-anchor="end">12.21%</text>
          <rect x="0" y="19" width="270" height="7" rx="3.5" fill="#1f2937"/>
          <rect x="0" y="19" width="33.0" height="7" rx="3.5" fill="#e34c26">
            <animate attributeName="width" from="0" to="33.0" dur="1.2s" begin="0.08s" fill="freeze"/>
          </rect>
        </g>
        <g class="langRow" transform="translate(0 62)">
          <circle cx="8" cy="8" r="5" fill="#89e051"/>
          <text x="22" y="12" class="lang">Shell</text>
          <text x="266" y="12" class="langPercent" text-anchor="end">2.94%</text>
          <rect x="0" y="19" width="270" height="7" rx="3.5" fill="#1f2937"/>
          <rect x="0" y="19" width="8.0" height="7" rx="3.5" fill="#89e051">
            <animate attributeName="width" from="0" to="8.0" dur="1.2s" begin="0.16s" fill="freeze"/>
          </rect>
        </g>
        <g class="langRow" transform="translate(0 93)">
          <circle cx="8" cy="8" r="5" fill="#DA5B0B"/>
          <text x="22" y="12" class="lang">Jupyter Notebook</text>
          <text x="266" y="12" class="langPercent" text-anchor="end">1.77%</text>
          <rect x="0" y="19" width="270" height="7" rx="3.5" fill="#1f2937"/>
          <rect x="0" y="19" width="8.0" height="7" rx="3.5" fill="#DA5B0B">
            <animate attributeName="width" from="0" to="8.0" dur="1.2s" begin="0.24s" fill="freeze"/>
          </rect>
        </g>
        <g class="langRow" transform="translate(0 124)">
          <circle cx="8" cy="8" r="5" fill="#3A4E3A"/>
          <text x="22" y="12" class="lang">Cuda</text>
          <text x="266" y="12" class="langPercent" text-anchor="end">0.66%</text>
          <rect x="0" y="19" width="270" height="7" rx="3.5" fill="#1f2937"/>
          <rect x="0" y="19" width="8.0" height="7" rx="3.5" fill="#3A4E3A">
            <animate attributeName="width" from="0" to="8.0" dur="1.2s" begin="0.32s" fill="freeze"/>
          </rect>
        </g>
        <g class="langRow" transform="translate(0 155)">
          <circle cx="8" cy="8" r="5" fill="#f1e05a"/>
          <text x="22" y="12" class="lang">JavaScript</text>
          <text x="266" y="12" class="langPercent" text-anchor="end">0.46%</text>
          <rect x="0" y="19" width="270" height="7" rx="3.5" fill="#1f2937"/>
          <rect x="0" y="19" width="8.0" height="7" rx="3.5" fill="#f1e05a">
            <animate attributeName="width" from="0" to="8.0" dur="1.2s" begin="0.4s" fill="freeze"/>
          </rect>
        </g>
        <g class="langRow" transform="translate(0 186)">
          <circle cx="8" cy="8" r="5" fill="#f34b7d"/>
          <text x="22" y="12" class="lang">C++</text>
          <text x="266" y="12" class="langPercent" text-anchor="end">0.43%</text>
          <rect x="0" y="19" width="270" height="7" rx="3.5" fill="#1f2937"/>
          <rect x="0" y="19" width="8.0" height="7" rx="3.5" fill="#f34b7d">
            <animate attributeName="width" from="0" to="8.0" dur="1.2s" begin="0.48s" fill="freeze"/>
          </rect>
        </g>
        <g class="langRow" transform="translate(0 217)">
          <circle cx="8" cy="8" r="5" fill="#663399"/>
          <text x="22" y="12" class="lang">CSS</text>
          <text x="266" y="12" class="langPercent" text-anchor="end">0.41%</text>
          <rect x="0" y="19" width="270" height="7" rx="3.5" fill="#1f2937"/>
          <rect x="0" y="19" width="8.0" height="7" rx="3.5" fill="#663399">
            <animate attributeName="width" from="0" to="8.0" dur="1.2s" begin="0.56s" fill="freeze"/>
          </rect>
        </g>
    </g>
  </g>
</svg>
