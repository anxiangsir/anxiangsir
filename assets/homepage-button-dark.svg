<svg xmlns="http://www.w3.org/2000/svg" width="340" height="72" viewBox="0 0 340 72" role="img" aria-label="Visit my homepage">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="55%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="6" y="6" width="328" height="56" rx="28"/>
    </clipPath>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="6" y="10" width="328" height="56" rx="28" fill="url(#bg)" opacity="0.35" filter="url(#glow)"/>
  <rect x="6" y="6" width="328" height="56" rx="28" fill="url(#bg)"/>
  <rect x="6.5" y="6.5" width="327" height="55" rx="27.5" fill="none" stroke="url(#edge)" stroke-width="1"/>

  <g clip-path="url(#clip)">
    <rect x="-120" y="6" width="90" height="56" fill="url(#shine)" transform="skewX(-18)">
      <animate attributeName="x" from="-120" to="360" dur="3.2s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(30 22)" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round">
    <circle cx="14" cy="14" r="13" opacity="0.95"/>
    <ellipse cx="14" cy="14" rx="5.6" ry="13" opacity="0.9"/>
    <path d="M1.6 9.4h24.8M1.6 18.6h24.8" opacity="0.9"/>
  </g>

  <text x="78" y="30" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.3">Visit My Homepage</text>
  <text x="78" y="49" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#ffffff" opacity="0.78" letter-spacing="0.6">anxiangsir.github.io</text>

  <g transform="translate(298 27)" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M0 0l7 7-7 7">
      <animateTransform attributeName="transform" type="translate" values="0 0; 4 0; 0 0" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
