<svg xmlns="http://www.w3.org/2000/svg" width="340" height="64" viewBox="0 0 340 64" role="img" aria-label="Visit my homepage anxiangsir.com">
  <title>Visit My Homepage - anxiangsir.com</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="52%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#C0246B"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <clipPath id="pill">
      <rect x="2" y="2" width="336" height="60" rx="30"/>
    </clipPath>
  </defs>

  <rect x="2" y="2" width="336" height="60" rx="30" fill="url(#bg)"/>

  <g clip-path="url(#pill)">
    <rect x="-140" y="2" width="80" height="60" fill="url(#shine)" transform="skewX(-18)">
      <animate attributeName="x" from="-140" to="380" dur="3.4s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="2.5" y="2.5" width="335" height="59" rx="29.5" fill="none" stroke="url(#edge)" stroke-width="1"/>

  <g transform="translate(26 18)" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round">
    <circle cx="14" cy="14" r="13"/>
    <ellipse cx="14" cy="14" rx="5.6" ry="13"/>
    <path d="M1.6 9.4h24.8M1.6 18.6h24.8"/>
  </g>

  <text x="72" y="27" font-family="Helvetica Neue,Helvetica,Segoe UI,Roboto,Arial,sans-serif"
        font-size="17" font-weight="700" fill="#ffffff"
        textLength="170" lengthAdjust="spacingAndGlyphs">Visit My Homepage</text>
  <text x="72" y="45" font-family="Helvetica Neue,Helvetica,Segoe UI,Roboto,Arial,sans-serif"
        font-size="12" font-weight="400" fill="#ffffff" fill-opacity="0.82"
        textLength="104" lengthAdjust="spacingAndGlyphs">anxiangsir.com</text>

  <g transform="translate(296 25)" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M0 0l7 7-7 7">
      <animateTransform attributeName="transform" type="translate" values="0 0; 4 0; 0 0" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>
